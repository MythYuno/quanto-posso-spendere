<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Quanto posso spendere</title>
<meta name="description" content="Inserisci lo stipendio, togli il fisso e il risparmio: ti dice quanto puoi spendere oggi fino al prossimo stipendio.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDF3F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#071415" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quanto spendo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="field" aria-hidden="true"></div>

<div class="app" id="app">

  <header class="top">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Schede"></nav>
    <button class="gear" id="btnSettings" type="button" aria-label="Impostazioni">
      <svg width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="10" cy="10" r="2.7" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 2.4l1.2 1.9 2.2-.5.5 2.2 1.9 1.2-1.1 2 1.1 2-1.9 1.2-.5 2.2-2.2-.5L10 17.6l-1.2-1.9-2.2.5-.5-2.2-1.9-1.2 1.1-2-1.1-2 1.9-1.2.5-2.2 2.2.5L10 2.4z"
              stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <div class="pager" id="pager">

    <section class="screen" id="sc0" role="tabpanel" aria-label="Oggi">
      <div class="panel lift home">
        <div id="hero" aria-live="polite"></div>
        <div class="today" id="today"></div>
        <form class="quick" id="addForm" autocomplete="off" hidden>
          <div class="quick-main">
            <span class="quick-cur" aria-hidden="true">€</span>
            <input id="exAmt" class="amt" inputmode="decimal" placeholder="0,00" aria-label="Importo della spesa appena fatta">
            <button class="add" type="submit" aria-label="Aggiungi spesa">
              <svg width="22" height="22" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M10 4.4v11.2M4.4 10h11.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="quick-row2">
            <input id="exNote" placeholder="che cos'è?" maxlength="60" aria-label="Per cosa">
            <input id="exDate" type="date" aria-label="Giorno della spesa">
          </div>
          <label class="chip" id="onceChip" for="exOnce" title="Viene tolta dal budget ma non conta nella media giornaliera">
            <input type="checkbox" id="exOnce">
            <span>Una tantum, fuori dal ritmo</span>
          </label>
        </form>
      </div>
    </section>

    <section class="screen" id="sc1" role="tabpanel" aria-label="Previsione">
      <div class="panel tall">
        <div class="card-head">
          <h2>Previsione</h2>
          <span class="meta" id="chartNote"></span>
        </div>
        <div class="chart-host" id="chartHost"><div class="tip" id="tip"></div></div>
        <div class="keys" id="keys"></div>
        <div id="forecastFoot"></div>
      </div>
    </section>

    <section class="screen" id="sc2" role="tabpanel" aria-label="Spese del periodo">
      <div class="panel tall">
        <div class="card-head">
          <h2>Spese del periodo</h2>
          <span class="meta" id="listTotal"></span>
        </div>
        <div class="scroller" id="list"></div>
      </div>
    </section>

    <section class="screen" id="sc3" role="tabpanel" aria-label="Messo da parte">
      <div class="panel tall">
        <div class="card-head">
          <h2>Messo da parte</h2>
          <span class="meta" id="savedTotal"></span>
        </div>
        <div class="scroller" id="savedBars"></div>
      </div>
    </section>

  </div>

</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-inner">
    <h2 id="sheetTitle">Impostazioni</h2>

    <div class="f">
      <label for="stSalary">Stipendio netto</label>
      <input id="stSalary" inputmode="decimal" placeholder="1.800">
    </div>
    <div class="grid2">
      <div class="f">
        <label for="stFixed">Spese fisse</label>
        <input id="stFixed" inputmode="decimal" placeholder="0">
      </div>
      <div class="f">
        <label for="stSave">Da mettere da parte</label>
        <input id="stSave" inputmode="decimal" placeholder="0">
      </div>
    </div>
    <p class="hint tight">Affitto, bollette, abbonamenti e risparmio vengono tolti prima: quello che resta è davvero tuo.</p>
    <div class="grid2">
      <div class="f">
        <label for="stStart">Inizio periodo</label>
        <input id="stStart" type="date">
      </div>
      <div class="f">
        <label for="stEnd">Prossimo stipendio</label>
        <input id="stEnd" type="date">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="solid accent" type="button" id="stApply">Salva</button>
      <button class="link" type="button" id="stClose">Chiudi</button>
    </div>

    <div class="zone">
      <h3 id="themeLabel">Tema</h3>
      <div class="seg" id="segTheme" role="group" aria-labelledby="themeLabel">
        <button type="button" data-t="auto">Auto</button>
        <button type="button" data-t="light">Chiaro</button>
        <button type="button" data-t="dark">Scuro</button>
      </div>
    </div>

    <div class="zone">
      <h3>Periodo</h3>
      <button class="link" type="button" id="stNewPeriod">Ho ricevuto lo stipendio → chiudi il periodo e aprine uno nuovo</button>
    </div>

    <div class="zone">
      <h3>Backup</h3>
      <p class="hint tight">I dati stanno solo in questo browser. Esporta un file per spostarli su un altro dispositivo.</p>
      <div class="sheet-actions">
        <button class="link" type="button" id="stExport">Esporta dati</button>
        <button class="link" type="button" id="stImport">Importa da file</button>
        <input type="file" id="fileIn" accept="application/json,.json" hidden>
      </div>
      <button class="link danger" type="button" id="stWipe">Cancella le spese di questo periodo</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js" defer></script>
</body>
</html>
