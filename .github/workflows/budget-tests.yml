name: Test del budget
on:
  pull_request:
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'tests/**'
      - '.github/workflows/budget-tests.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python tests/test_browser.py -v
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
